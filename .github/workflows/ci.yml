name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t csptool-receiver:ci .

  ubuntu-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Ubuntu 26.04 installer test image
        run: docker build -f tests/deployment/Dockerfile -t receiver-installer-test .
      - name: Test installation, nginx TLS, upgrades, and rollback
        run: docker run --rm -v "$PWD:/source:ro" receiver-installer-test
